# Minimal VALID behavioral study config, the fixture the mutation tests start from.
study_id: fixture-valid-draft
experiment: exp1
status: draft
protocol:
  lab_docs: [docs/methodology.md]
  protocol_hash: null
  rubric_version: lhcr-rubric-v1
certification:
  require: CONDITIONALLY CERTIFIED
  gates_file: findings/exp0/gates.json
environment:
  model: qwen.qwen3-235b-a22b-2507-v1:0
judges:
  - { key: judge_a, model: "us.meta.llama3-3-70b-instruct-v1:0", family: open, provider: bedrock }
  - { key: judge_b, model: "us.anthropic.claude-sonnet-4-6", family: anthropic, provider: bedrock }
  - { key: judge_c, model: "gpt-5.1", family: openai, provider: openai }
subjects:
  - us.deepseek.r1-v1:0
  - nvidia.nemotron-nano-9b-v2
design:
  k: 5
  challenges: all
  max_turns: 6
blinding:
  judges_blind_to_subject: true
exclusions:
  - { id: E1, rule: "cell has <2 valid judge verdicts after one rerun", action: report }
  - { id: E5, rule: "judge verdict with parse_ok=false", action: drop }
